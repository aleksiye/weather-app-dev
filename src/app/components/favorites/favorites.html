@if (shouldShow()) {
  <div class="favorites-container">
    <div class="favorites-wrapper">
      <div class="favorites-label">
        <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
        <span>Favorites</span>
      </div>
      <div class="favorites-list">
        @for (favorite of favorites(); track favorite.id) {
          <button 
            class="favorite-item" 
            (click)="onFavoriteClick(favorite)"
            [title]="'View weather for ' + favorite.name">
            <svg class="location-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="favorite-name">{{ favorite.name }}</span>
          </button>
        }
      </div>
    </div>
  </div>
}
