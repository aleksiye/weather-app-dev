<header class="header">
  <div class="header-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <a href="/" class="logo-link">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
        </svg>
        <div class="logo-content">
          <span class="logo-top-text">monkey forecast</span>
          <span class="logo-text">monkeyweather</span>
        </div>
      </a>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <app-search (searchSubmitted)="onSearchSubmitted($event)"></app-search>
    </div>

    <!-- Login Section -->
    <div class="login-section">
      <button class="login-button" (click)="onLogin()">
        <svg class="user-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Login</span>
      </button>
    </div>
  </div>
</header>
